[Unit]
After=tidetracker-firstboot.service
Requires=tidetracker-firstboot.service
ConditionPathExists=/var/lib/tidetracker/provisioned

[Service]
ExecCondition=/bin/sh -c 'test -f /var/lib/tidetracker/provisioned && test ! -L /var/lib/tidetracker/provisioned && case "$(cat /var/lib/tidetracker/provisioned)" in controller|zero) exit 0 ;; *) exit 1 ;; esac'
