[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tide-tracker"
version = "2.0.0"
description = "Power-bounded NOAA tide display runtime for Raspberry Pi Zero W"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "Pillow>=9.4,<13",
]

[project.optional-dependencies]
legacy-renderer = [
  "matplotlib>=3.6,<4",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
tidetracker = "tidetracker.cli:main"
tidetracker-update = "tidetracker.cli:update_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests", "lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
